# VSCODE
<!DOCTYPE html>
<html>

<head>
    <title> Login - Controle de gastos</title>
</head>

<body>
    <form>

        <h1> Página simples de Login</h1>

        <div>
            <div><label>Email</label></div>
            <input type="email" name="email" placeholder="seu@email.com"/>
        </div>

        <div>
            <div><label>Senha</label></div>
            <input type="password" name="password" placeholder="Sua senha"/>
        </div>
<br>
        <div>
            <button type="button" class="clear">Recuperar senha</button>
        </div>

        <div>
            <button type="button" class="solid">Entrar</button>
        </div>

        <div>
            <button type="button" class="outline">Registrar</button>
        </div>        
    </form>
</body>

<style>

body{
        background: rgb(95, 93, 219);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    form {
        width: 300px;
    }

    input, button {
        padding: 5px;
        margin-bottom: 5px;
         width: -webkit-fill-available;
    }
    button{
        cursor: pointer;
    }
    button:active {
        opacity: 0.8;
    }
    .solid {
        background: white;
        border: none;
    }
    .outline, .clear {
        background: transparent;
        color: white;
        border: 1px solid white;
    }


</style>

</html>
